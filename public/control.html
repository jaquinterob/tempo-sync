<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>Control · Temporizador remoto</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="control-page">
    <main class="app-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">Temporizador remoto</p>
          <h1>Panel de control</h1>
        </div>
        <span id="connection-status" class="status-pill status-offline">Desconectado</span>
      </header>

      <section id="join-panel" class="card join-card">
        <div>
          <h2>Entrar a una sala</h2>
          <p>Usa el mismo PIN en el control y en la pantalla.</p>
        </div>
        <form id="join-form" class="join-form">
          <label for="pin">PIN de sala</label>
          <div class="inline-fields">
            <input
              id="pin"
              name="pin"
              type="text"
              minlength="3"
              maxlength="12"
              pattern="[A-Za-z0-9]+"
              autocomplete="off"
              placeholder="EJ. 1234"
              required
            />
            <button type="submit" class="button button-primary">Conectar</button>
          </div>
          <p id="join-error" class="form-error" role="alert"></p>
        </form>
      </section>

      <section id="timer-panel" class="timer-layout is-hidden">
        <article class="card timer-card">
          <div class="room-line">
            <span>Sala</span>
            <strong id="room-pin">—</strong>
          </div>
          <p id="timer" class="timer" aria-live="polite">05:00</p>
          <p id="timer-label" class="timer-label">Listo para iniciar</p>
        </article>

        <article class="card controls-card">
          <h2>Configurar tiempo</h2>
          <form id="time-form">
            <div class="time-inputs">
              <label>
                <span>Minutos</span>
                <input id="minutes" type="number" min="0" max="1440" value="5" inputmode="numeric" />
              </label>
              <span class="time-separator">:</span>
              <label>
                <span>Segundos</span>
                <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric" />
              </label>
            </div>
            <button type="submit" class="button button-secondary button-full">Aplicar tiempo</button>
            <p id="time-error" class="form-error" role="alert"></p>
          </form>

          <div class="action-grid">
            <button id="start-button" type="button" class="button button-start">Iniciar</button>
            <button id="pause-button" type="button" class="button button-secondary">Pausar</button>
            <button id="reset-button" type="button" class="button button-danger">Reiniciar</button>
          </div>

          <a id="display-link" class="display-link" href="/display.html" target="_blank" rel="noreferrer">
            Abrir pantalla del temporizador
          </a>
        </article>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/control.js"></script>
  </body>
</html>
