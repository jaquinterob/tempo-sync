<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f4ef" />
    <title>Control · Pulpit Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=VT323&family=Archivo:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="control-page">
    <script>
      try {
        var t = localStorage.getItem("pulpit-panel-theme");
        if (["kiosk", "print", "accessible"].indexOf(t) !== -1) {
          document.body.classList.add("control-theme-" + t);
        }
      } catch (e) {}
    </script>
    <main class="app-shell">
      <header class="page-header brand-header">
        <div class="brand-lockup">
          <img
            class="brand-mark brand-mark-church"
            src="/assets/brand/church-logo.png"
            alt="La Iglesia de Jesucristo de los Santos de los Últimos Días"
            width="40"
            height="72"
          />
          <div>
            <h1 id="control-ward-title">Barrio Sabaneta</h1>
            <p class="brand-sub">Pulpit Timer · reunión sacramental</p>
          </div>
        </div>
        <span id="connection-status" class="status-pill status-offline">OFFLINE</span>
      </header>

      <section id="join-panel" class="card join-card">
        <div>
          <h2>Entrar a una sala</h2>
          <p>Si ya tienes un PIN, escríbelo aquí. Si no, vuelve al inicio y crea una sala.</p>
        </div>
        <form id="join-form" class="join-form">
          <label for="pin">PIN</label>
          <div class="inline-fields">
            <input
              id="pin"
              name="pin"
              type="text"
              minlength="3"
              maxlength="12"
              pattern="[A-Za-z0-9]+"
              autocomplete="off"
              placeholder="EJ. 1505"
              required
            />
            <button type="submit" class="button button-primary">Entrar</button>
          </div>
          <p id="join-error" class="form-error" role="alert"></p>
          <p class="join-home-link">
            <a href="/">← Crear sala nueva</a>
          </p>
        </form>
      </section>

      <section id="timer-panel" class="matrix-layout is-hidden">
        <article class="card matrix-status-bar">
          <button id="change-room-button" type="button" class="matrix-status-cell matrix-room-button">
            <span class="matrix-kicker">Sala</span>
            <strong id="room-pin">—</strong>
            <span class="matrix-room-hint">cambiar sala</span>
          </button>
          <div class="matrix-status-timer">
            <p id="timer" class="timer timer-compact" aria-live="polite">08:00</p>
            <p id="timer-label" class="timer-label">Listo</p>
          </div>
          <div class="matrix-status-cell matrix-status-right">
            <span class="matrix-kicker">Conexión</span>
            <strong id="connection-status-inline" class="status-inline status-offline">Desconectado</strong>
          </div>
          <div class="time-meter time-meter-control" aria-hidden="true" title="Tiempo restante">
            <div id="time-meter-fill" class="time-meter-fill"></div>
          </div>
        </article>

        <article class="card matrix-board">
          <div class="matrix-grid">
            <button type="button" class="preset-button preset-wide" data-duration-ms="480000">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <span class="preset-label">
                <strong>Discursos</strong>
                <span>8 min</span>
              </span>
            </button>
            <button id="start-button" type="button" class="button button-start matrix-tall">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5.5v13l11-6.5z" fill="currentColor" />
              </svg>
              <span class="btn-label">Iniciar</span>
            </button>
            <button id="blank-screen-button" type="button" class="button blank-screen-button matrix-tall">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4.5" width="18" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="M9 20.5h6M12 17.5v3" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="M7 9.5l5 4M17 9.5l-5 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <span id="blank-screen-label" class="btn-label">Ocultar pantalla</span>
            </button>
            <button id="pause-button" type="button" class="button button-secondary button-pause">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
              </svg>
              <span class="btn-label">Pausar</span>
            </button>
            <button id="reset-button" type="button" class="button button-danger">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <path d="M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span class="btn-label">Reiniciar</span>
            </button>

            <form id="time-form" class="matrix-time-form">
              <label>
                <span class="visually-hidden">MIN</span>
                <input id="minutes" type="number" min="0" max="1440" value="8" inputmode="numeric" />
              </label>
              <span class="time-separator">:</span>
              <label>
                <span class="visually-hidden">SEC</span>
                <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric" />
              </label>
              <button type="submit" class="button button-secondary btn-inline">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="btn-label">Aplicar</span>
              </button>
              <p id="time-error" class="form-error" role="alert"></p>
            </form>

            <form id="message-form" class="matrix-message-form">
              <label class="visually-hidden" for="screen-message">MSG_SCROLL</label>
              <input
                id="screen-message"
                type="text"
                maxlength="180"
                autocomplete="off"
                placeholder="Por favor, concluya su discurso"
              />
              <button type="submit" class="button button-primary btn-inline">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8" />
                </svg>
                <span class="btn-label">Mostrar</span>
              </button>
              <button id="clear-message-button" type="button" class="button button-secondary btn-inline">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                <span class="btn-label">Quitar</span>
              </button>
            </form>
          </div>

          <div class="share-bar">
            <div class="share-row">
              <span class="share-pin-chip">
                <span class="share-kicker">PIN</span>
                <strong id="share-pin">—</strong>
              </span>
              <button id="copy-display-link" type="button" class="share-action" title="Copiar enlace">
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="8" y="8" width="11" height="13" rx="1" fill="none" stroke="currentColor" stroke-width="1.7" />
                  <path d="M6 16H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" fill="none" stroke="currentColor" stroke-width="1.7" />
                </svg>
                <span>Copiar</span>
              </button>
              <a
                id="whatsapp-share"
                class="share-action"
                href="#"
                target="_blank"
                rel="noreferrer"
                title="Enviar por WhatsApp"
              >
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M5 19l1.2-3.5A7.5 7.5 0 1 1 19.5 12 7.5 7.5 0 0 1 8.2 17.8L5 19z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />
                  <path
                    d="M9.2 10.2c.3-.5.5-.5.8-.5h.6c.2 0 .4.1.5.4l.7 1.7c.1.2 0 .4-.1.6l-.4.5c-.1.1-.1.3 0 .4.5.8 1.3 1.5 2.1 1.9.2.1.3.1.5 0l.7-.4c.2-.1.4-.1.5.1l1.2 1.4c.2.2.1.5-.1.7-.4.3-1 .6-1.6.6-2.3 0-5.1-2.5-5.8-4.7-.2-.7-.1-1.4.2-1.9z"
                    fill="currentColor"
                    opacity="0.9"
                  />
                </svg>
                <span>WhatsApp</span>
              </a>
              <a
                id="display-link"
                class="share-action"
                href="/display.html"
                target="_blank"
                rel="noreferrer"
                title="Abrir pantalla"
              >
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7" />
                  <path d="M9 20h6M12 17v3" fill="none" stroke="currentColor" stroke-width="1.7" />
                </svg>
                <span>Abrir</span>
              </a>
            </div>
            <p id="share-status" class="share-status" aria-live="polite"></p>
          </div>
        </article>

        <article class="card brand-config-card">
          <div class="brand-config-head">
            <h2>Identidad</h2>
            <div class="brand-config-actions">
              <div class="panel-theme-menu">
                <button
                  id="panel-theme-button"
                  type="button"
                  class="button button-secondary theme-toggle"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span id="panel-theme-label" class="theme-toggle-label">PANEL: Clásico</span>
                  <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
                <div
                  id="panel-theme-options"
                  class="panel-theme-options is-hidden"
                  role="listbox"
                  aria-label="Tema del panel"
                >
                  <button type="button" role="option" data-control-theme="classic" aria-selected="true" class="panel-theme-option">
                    Clásico <span class="option-check" aria-hidden="true">✓</span>
                  </button>
                  <button type="button" role="option" data-control-theme="kiosk" class="panel-theme-option">
                    Kiosk <span class="option-check" aria-hidden="true">✓</span>
                  </button>
                  <button type="button" role="option" data-control-theme="print" class="panel-theme-option">
                    Print <span class="option-check" aria-hidden="true">✓</span>
                  </button>
                  <button type="button" role="option" data-control-theme="accessible" class="panel-theme-option">
                    Accesible <span class="option-check" aria-hidden="true">✓</span>
                  </button>
                </div>
              </div>
              <button
                id="theme-toggle"
                type="button"
                class="button button-secondary theme-toggle"
                aria-pressed="false"
                aria-label="Tema display"
                title="Tema display"
              >
                <span class="theme-toggle-label">DISPLAY: Claro</span>
                <svg
                  id="theme-icon"
                  class="ui-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6" />
                  <path
                    d="M12 5v1.2M12 17.8V19M5 12h1.2M17.8 12H19M7.1 7.1l.85.85M16.05 16.05l.85.85M16.9 7.1l-.85.85M7.95 16.05l-.85.85"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
              <p id="branding-status" class="branding-status" aria-live="polite"></p>
            </div>
          </div>
          <form id="branding-form" class="branding-form">
            <label class="brand-field">
              <span>Barrio</span>
              <input id="ward-name" type="text" maxlength="60" value="Barrio Sabaneta" required />
            </label>
            <label class="brand-field">
              <span>Mensaje al terminar</span>
              <input
                id="finish-thanks"
                type="text"
                maxlength="80"
                value="Agradecemos su discurso."
                required
              />
            </label>
            <label class="brand-field">
              <span>Alerta final</span>
              <input
                id="finish-done"
                type="text"
                maxlength="80"
                value="Su tiempo ha terminado."
                required
              />
            </label>
            <button type="submit" class="button button-primary brand-save btn-inline">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span class="btn-label">Guardar</span>
            </button>
          </form>
        </article>
      </section>

      <p class="control-credit">Developer: <strong>JohnQ</strong> · All rights reserved</p>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/control.js"></script>
  </body>
</html>
