<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pulpit Timer" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest?v=3" />
    <title>Pulpit Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Libre+Franklin:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css?v=73" />
    <script>
      try {
        if (localStorage.getItem("pulpit-entry-seen") === "1") {
          location.replace("/control");
        }
      } catch {
        // sin localStorage: mostrar inicio
      }
    </script>
  </head>
  <body class="entry-page">
    <script>
      try {
        if (localStorage.getItem("pulpit-theme") === "dark") {
          document.body.classList.add("entry-dark");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#171614");
        }
      } catch (e) {}
    </script>
    <main class="entry-shell">
      <div class="entry-brand">
        <img
          class="entry-logo"
          src="/assets/brand/church-logo.png"
          alt=""
          width="48"
          height="86"
        />
        <p class="entry-product">Pulpit Timer</p>
        <h1 id="entry-ward-title" class="entry-ward is-placeholder">Tu unidad</h1>
      </div>

      <div class="entry-body">
        <form id="unit-form" class="entry-form" novalidate>
          <label class="entry-label" for="unit-name">Nombre de tu unidad</label>
          <input
            id="unit-name"
            class="entry-input"
            type="text"
            name="unit"
            maxlength="60"
            required
            autocomplete="organization"
            placeholder="Ej. Barrio Sabaneta"
          />
          <p id="unit-error" class="entry-step-error" role="alert" hidden>
            Falta el nombre.
          </p>
        </form>
        <p class="entry-tip">
          En este dispositivo controlas e inicias el temporizador para el
          discursante. Al crear la sala verás un código QR: escanéalo desde el
          otro dispositivo y colócalo en el púlpito en horizontal.
        </p>
      </div>

      <div class="entry-footer">
        <button type="button" class="entry-button" id="create-room">
          Crear sala
        </button>
      </div>
    </main>

    <script src="/js/shared.js?v=22"></script>
    <script src="/js/pwa.js?v=17"></script>
    <script>
      const {
        UNIT_PLACEHOLDER,
        markEntrySeen,
        normalizeUnitText,
      } = window.TimerTools;

      const unitNameInput = document.querySelector("#unit-name");
      const unitError = document.querySelector("#unit-error");
      const wardTitle = document.querySelector("#entry-ward-title");
      const createButton = document.querySelector("#create-room");

      function currentLabel() {
        return normalizeUnitText(unitNameInput.value, 60);
      }

      function syncTitle() {
        const label = currentLabel();
        wardTitle.textContent = label || UNIT_PLACEHOLDER;
        wardTitle.classList.toggle("is-placeholder", !label);
      }

      function unitIsValid() {
        const ok = Boolean(currentLabel());
        unitError.hidden = ok;
        return ok;
      }

      function goCreateRoom() {
        if (!unitIsValid()) {
          unitNameInput.focus();
          return;
        }

        const ward = currentLabel();
        try {
          localStorage.setItem("pulpit-ward-name", ward);
        } catch {
          // sin localStorage
        }
        markEntrySeen();

        window.location.href = `/control?${new URLSearchParams({
          create: "1",
          ward,
        })}`;
      }

      try {
        unitNameInput.value = normalizeUnitText(
          localStorage.getItem("pulpit-ward-name"),
          60,
        );
      } catch {
        unitNameInput.value = "";
      }

      syncTitle();
      unitNameInput.focus();

      unitNameInput.addEventListener("input", () => {
        unitError.hidden = true;
        syncTitle();
      });

      createButton.addEventListener("click", goCreateRoom);

      document.querySelector("#unit-form").addEventListener("submit", (event) => {
        event.preventDefault();
        goCreateRoom();
      });
    </script>
  </body>
</html>
