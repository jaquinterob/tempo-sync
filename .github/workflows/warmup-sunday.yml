# Mantiene despierto el plan Free de Render los domingos por la mañana (Colombia, UTC-5).
# Cada ~12 min entre 7:00 y 12:59 hora Colombia = 12:00-17:59 UTC.
name: Warmup Render (domingo mañana)

on:
  schedule:
    - cron: "*/12 12-17 * * 0"
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/warmup
        env:
          WARMUP_URL: ${{ vars.WARMUP_URL }}
        run: |
          set -euo pipefail
          URL="${WARMUP_URL:-https://tempo-sync-wixa.onrender.com/api/warmup}"
          echo "Warmup URL: $URL"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 90 "$URL"; then
              echo
              echo "Warmup OK (intento $attempt)"
              exit 0
            fi
            echo "Intento $attempt falló; reintento en 20s..."
            sleep 20
          done
          echo "Warmup falló tras varios intentos"
          exit 1
